[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cox-protocol-package"
version = "1.0.0"
description = "Validator and compiler for COX design-spec documents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.23",
  "typer>=0.12",
  "rich>=13.7",
]

[project.scripts]
cox = "tools.cox_cli:app"

[tool.setuptools]
packages = ["tools"]