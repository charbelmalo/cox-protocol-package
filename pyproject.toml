[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cox-protocol-package"
version = "1.2.0"
description = "Validator and compiler for COX design-spec documents"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Charbel Malo" },
]
keywords = [
  "agent-protocol",
  "cox",
  "design-spec",
  "schema",
  "ui-reconstruction",
  "yaml",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.23",
  "typer>=0.12",
  "rich>=13.7",
]

[project.scripts]
cox = "cox_protocol.cox_cli:app"

[project.urls]
Homepage = "https://github.com/charbelmalo/cox-protocol-package#readme"
Repository = "https://github.com/charbelmalo/cox-protocol-package"
Issues = "https://github.com/charbelmalo/cox-protocol-package/issues"

[tool.setuptools]
packages = ["cox_protocol"]
include-package-data = false

[tool.setuptools.package-data]
cox_protocol = ["schemas/*.json", "starter/*", "starter/page/*", "starter/page/action_button/*"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "build>=1.0", "twine>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
